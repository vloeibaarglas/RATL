name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'specs/**'
      - '*.md'
      - 'examples/**'
      - 'docs/**'
      - '.mimocode/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Run tests
        run: make test
