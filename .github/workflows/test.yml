name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'docs/**'
      - '.mimocode/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/renv
            ~/.R/library
          key: r-${{ runner.os }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: r-${{ runner.os }}-

      - uses: r-lib/actions/setup-r@v2

      - name: Run tests
        run: make test
