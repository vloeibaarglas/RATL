name: Regen Spec

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/ratl_def.tsv'
      - 'scripts/gen_spec.py'
      - 'scripts/gen_tests.py'

permissions:
  contents: write

jobs:
  regen-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Quarto
        id: cache-quarto
        uses: actions/cache@v5
        with:
          path: /opt/quarto
          key: quarto-${{ runner.os }}-v2

      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.cache-quarto.outputs.cache-hit != 'true'

      - name: Add Quarto to PATH
        if: steps.cache-quarto.outputs.cache-hit == 'true'
        run: echo "/opt/quarto/bin" >> $GITHUB_PATH

      - uses: r-lib/actions/setup-r@v2

      - name: Regenerate spec
        run: |
          make gen-tests
          make spec

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ tests/test_all_symbols.R
          git diff --cached --quiet || git commit -m "docs: regenerate spec + tests [skip ci]"
          git push
