<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script>
// Create filter bar above Symbol Reference section
var filterBar = document.createElement('div');
filterBar.className = 'spec-filter-bar';
filterBar.innerHTML = '<label for="global-filter-input">Filter all tables:</label>' +
  '<input type="text" id="global-filter-input" placeholder="Type to filter across all tables...">';
var symbolRef = document.getElementById('symbol-reference');
if (symbolRef) {
  symbolRef.insertAdjacentElement('beforebegin', filterBar);
} else {
  var h1 = document.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', filterBar);
}

// Init all tables as DataTables
var allDt = [];
document.querySelectorAll('table').forEach(function(table) {
  if (!table.classList.contains('no-datatable')) {
    try {
      var dt = new DataTable(table, {
        pageLength: -1,
        order: [],
        dom: "t"
      });
      allDt.push(dt);
    } catch(e) {}
  }
});

// Connect filter to all initialized tables
document.getElementById('global-filter-input').addEventListener('input', function() {
  var val = this.value;
  allDt.forEach(function(dt) {
    dt.search(val).draw();
  });
});
</script>
